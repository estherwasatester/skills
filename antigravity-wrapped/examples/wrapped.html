<script>
  // All dynamic content is rendered with createElement/textContent only.
  const { stats, story, ai, hasAudio, audioSrc } = JSON.parse(document.getElementById('data').textContent);
  const deck = document.getElementById('deck');

  function el(tag, props = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) k === 'class' ? (n.className = v) : (n[k] = v);
    for (const k of kids) if (k != null && k !== false) n.append(k instanceof Node ? k : document.createTextNode(String(k)));
    return n;
  }
  const slides = [];
  const slide = (label, ...kids) => slides.push(el('section', { class: 'slide', ariaLabel: label }, ...kids));
  const bars = (items, unit = '') => {
    const max = Math.max(1, ...items.map((i) => i.count));
    return el('div', { class: 'bars' }, ...items.map((i, k) => {
      const fill = el('div', { class: `fill c${k % 4}` });
      fill.dataset.w = (i.count / max) * 55 + '%';
      return el('div', { class: 'bar' }, el('div', { class: 'label', title: i.name }, i.name), fill, el('div', { class: 'n' }, i.label || i.count + unit));
    }));
  };
  const chips = (items) => el('div', { class: 'chips' }, ...items.map((i, k) => el('span', { class: `chip c${k % 4}` }, i.name)));
  const statGrid = (pairs) => el('div', { class: 'grid' }, ...pairs.map(([n, l], k) => el('div', { class: 'stat' }, el('b', { class: `t${k % 4}` }, n), el('span', {}, l))));
  const fmtTok = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);
  const t = stats.totals, w = stats.when || {}, u = stats.usage;

  // 1. Intro (+ audio overview only when one was recorded)
  slide('Intro', el('p', { class: 'kicker' }, `Antigravity Wrapped · ${stats.project}`), el('h1', {}, story.title), el('p', { class: 'big' }, story.tagline));
  if (hasAudio && typeof audioSrc === 'string' && audioSrc.startsWith('data:audio/')) {
    const audio = el('audio', { preload: 'auto', src: audioSrc });
    const PLAY = '▶ Play the audio overview', PAUSE = '❚❚ Pause audio overview';
    const btn = el('button', { class: 'play', type: 'button', textContent: PLAY });
    const label = () => (btn.textContent = audio.paused ? PLAY : PAUSE);
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (audio.paused) audio.play().catch((err) => (btn.textContent = `⚠ ${err.name}: can't play audio`));
      else audio.pause();
    });
    for (const ev of ['play', 'pause', 'ended']) audio.addEventListener(ev, label);
    audio.addEventListener('error', () => (btn.textContent = '⚠ audio failed to load'));
    // Text transcript of the audio for people who can't or don't want to listen.
    const tr = el('details', { class: 'transcript' }, el('summary', {}, 'Transcript'), el('div', {}, story.audioScript || ''));
    tr.addEventListener('click', (e) => e.stopPropagation());
    document.body.append(audio, btn, tr);
  }

  // 2. Big numbers
  slide('By the numbers', el('p', { class: 'kicker' }, 'By the numbers'),
    statGrid([[t.conversations, 'conversations'], [t.subagentConversations, 'subagent runs'], [t.toolCalls, 'tool calls'], [t.filesTouched, 'files written']]));

  // 3. When you worked
  if (w.activeDays) {
    const max = Math.max(1, ...w.hours);
    const cols = el('div', { class: 'cols', ariaHidden: 'true' }, ...w.hours.map((n, h) => { const c = el('div', { class: `c${h % 4}`, title: `${h}:00 · ${n}` }); c.dataset.h = (n / max) * 100 + '%'; return c; }));
    const hr = (h) => `${String(h).padStart(2, '0')}:00`;
    slide('When you worked', el('p', { class: 'kicker' }, 'When you worked'),
      el('h2', {}, w.busiestHour != null ? `Peak hour: ${hr(w.busiestHour)}` : `${w.activeDays} active days`),
      statGrid([[w.activeDays, 'active days'], [w.longestStreak, 'day streak'], [t.userPrompts, 'prompts']]),
      el('div', { style: 'margin-top:4vh' }, cols, el('div', { class: 'axis', ariaHidden: 'true' }, el('span', {}, '00'), el('span', {}, '06'), el('span', {}, '12'), el('span', {}, '18'), el('span', {}, '23'))));
  }

  // 4. Models, tokens, cost
  const known = u.models.filter((m) => m.name !== 'unknown');
  if (known.length) {
    slide('Models', el('p', { class: 'kicker' }, 'The models behind it'), el('h2', {}, known.length === 1 ? `${known[0].name}, all the way.` : `${known.length} models, one workspace.`),
      bars(u.models.map((m) => ({ name: m.name, count: m.tokens, label: `${fmtTok(m.tokens)} tokens · ${m.conversations} convs${m.cost != null ? ` · ~$${m.cost.toFixed(2)}` : ''}` }))));
  }
  if (u.tokens) {
    const cachePct = Math.round((u.cached / Math.max(1, u.tokens)) * 100);
    const pairs = [[fmtTok(u.tokens), 'tokens processed'], [`${cachePct}%`, 'served from cache'], [fmtTok(u.output), 'tokens written']];
    if (u.cost != null) pairs.push([`~$${u.cost.toFixed(2)}`, 'at list prices']);
    slide('Tokens', el('p', { class: 'kicker' }, u.cost != null ? 'The bill (approx.)' : 'Tokens'), statGrid(pairs),
      u.cost != null && el('p', { class: 'big' }, `≈ $${(u.cost / Math.max(1, t.conversations)).toFixed(2)} per conversation. Estimate from list prices for known models; excludes cache writes and gemini-api calls.`));
  }

  // 5. Story chapters
  if (stats.timeline.length) {
    slide('The story so far', el('p', { class: 'kicker' }, 'The story so far'),
      el('ol', { class: 'timeline' }, ...stats.timeline.map((c, i) => {
        const ch = story.chapters?.[i] || {};
        return el('li', {}, el('div', { class: 't' }, ch.title || c.title || `Chapter ${i + 1}`), el('div', { class: 'd' }, `${c.date} · ${c.toolCalls} tool calls`),
          ch.blurb && el('div', { class: 'b' }, ch.blurb), c.prompt && el('q', {}, c.prompt));
      })));
  }

  // 6. The toolbox
  if (stats.slashCommands.length) slide('Slash commands', el('p', { class: 'kicker' }, 'Slash commands you summoned'), el('h2', {}, 'One keystroke, a whole workflow.'), chips(stats.slashCommands));
  if (stats.skills.length) slide('Skills', el('p', { class: 'kicker' }, 'Skills the agent loaded'), el('h2', {}, 'Expertise, on demand.'), bars(stats.skills, '×'));
  if (stats.clis.length) slide('CLIs', el('p', { class: 'kicker' }, 'CLIs it drove for you'), el('h2', {}, 'Your terminal, on autopilot.'), bars(stats.clis, '×'));
  if (stats.tools.length) slide('Tools', el('p', { class: 'kicker' }, 'Top agent tools'), el('h2', {}, 'How the work actually got done.'), bars(stats.tools, '×'));
  if (stats.hotFiles?.length) slide('Files', el('p', { class: 'kicker' }, 'Files you kept coming back to'), el('h2', {}, 'The hot spots.'), bars(stats.hotFiles, ' edits'));
  if (stats.subagents.length) slide('Subagents', el('p', { class: 'kicker' }, 'Your sidekicks'), el('h2', {}, `${t.subagentConversations} subagents joined the team.`), bars(stats.subagents, '×'));

  // 7. Archetype, fun facts, lesson
  slide('Archetype', el('p', { class: 'kicker' }, 'Your developer archetype'), el('h1', { class: 't2' }, story.archetype), el('p', { class: 'big' }, story.archetypeWhy));
  if (story.funFacts?.length) slide('Fun facts', el('p', { class: 'kicker' }, 'Fun facts'), el('ul', { class: 'facts' }, ...story.funFacts.map((f) => el('li', {}, f))));
  const replay = el('button', { class: 'ghost', type: 'button', textContent: '↺ Replay' });
  replay.addEventListener('click', (e) => { e.stopPropagation(); go(0); });
  slide('The lesson', el('p', { class: 'kicker' }, 'The lesson'), el('h2', { class: 't3' }, story.lesson),
    el('p', { class: 'big' }, ai ? 'Made with Antigravity + gemini-api.' : 'Made with Antigravity.'), replay);

  // Navigation: tap (left quarter = back), ←/→/Space/Enter, swipe. Inactive slides are inert.
  deck.append(...slides);
  const prog = document.getElementById('progress');
  const status = document.getElementById('status');
  prog.append(...slides.map(() => el('span')));
  let cur = -1;
  function go(i) {
    cur = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((s, k) => { s.classList.toggle('active', k === cur); s.inert = k !== cur; });
    [...prog.children].forEach((p, k) => p.classList.toggle('on', k <= cur));
    slides[cur].querySelectorAll('.fill').forEach((f) => (f.style.width = f.dataset.w));
    slides[cur].querySelectorAll('.cols div').forEach((c) => (c.style.height = c.dataset.h));
    status.textContent = `Slide ${cur + 1} of ${slides.length}: ${slides[cur].ariaLabel}`;
  }
  document.addEventListener('click', (e) => { if (!e.target.closest('button, details, a')) go(cur + (e.clientX < innerWidth / 4 ? -1 : 1)); });
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('button, summary') && [' ', 'Enter'].includes(e.key)) return; // let buttons work
    if (['ArrowRight', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); go(cur + 1); }
    if (e.key === 'ArrowLeft') go(cur - 1);
  });
  let x0 = null;
  addEventListener('touchstart', (e) => (x0 = e.touches[0].clientX), { passive: true });
  addEventListener('touchend', (e) => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) { go(cur + (dx < 0 ? 1 : -1)); e.preventDefault(); } });
  go(0);
</script>
</body>
</html>
